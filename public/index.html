<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FC26 Tournament Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Achromatic ledger (taste skill), tuned for a two-player duel. Ground a blue-grey #f2f4f7, white cards radius 8, ink chrome.
   The only hue is the blue of Hayk (--p0); Tigran is ink (--p1). Green/red appear only on result pills. One column 1160px. */
:root{
  color-scheme:light;
  --bg:#f2f4f7; --surface:#fff; --surface-2:#eeeeee; --ink:#0a0a0a; --muted:#6b6b6b; --faint:#767676; --line:#e6e6e6; --control:#d4d4d4;
  --p0:#1d5fbf; --p1:#141414;
  --btn-bg:#141414; --btn-fg:#fff; --focus:#1d5fbf;
  --w:#04250e; --w-bg:#dcfae5; --d:#3d3d3d; --d-bg:#eeeeee; --l:#831c1e; --l-bg:#ffedea;
  --warn:#92400e; --warn-bg:#fffbeb;
  --star:#141414; --star-e:#d4d4d4;
  --body:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:var(--body);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);font-variant-numeric:tabular-nums;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--body);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:20px;line-height:1.2} h3{font-size:16px;line-height:1.25}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:0 16px}
.top-in{max-width:1160px;margin:0 auto;min-height:56px;display:flex;align-items:center;gap:8px 28px;flex-wrap:wrap;justify-content:space-between;padding-block:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.brand svg{flex:none}
.brand small{display:block;font:400 12px var(--body);color:var(--faint);margin-top:2px;letter-spacing:0}
.brand .bt{display:grid}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tab{background:none;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--surface-2)}
main{padding-top:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
main>*{min-width:0}
.field{min-width:0}
.banner{background:var(--warn-bg);color:var(--warn);padding:12px 16px;border-radius:8px}
.banner{box-shadow:inset 0 0 0 1px #f3e3b0}.banner b{color:#7a3508}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline;flex:none}
.dot.p0{background:var(--p0)} .dot.p1{background:var(--p1)}
/* scoreboard: the one question is who is ahead, by points and by matchdays */
.board{background:var(--surface);color:var(--ink);border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);padding:24px clamp(16px,3vw,32px) 18px;display:grid;grid-template-columns:1fr;gap:0;--board-p0:var(--p0);--board-p1:var(--p1);--board-ink:var(--ink);--board-mut:var(--faint)}
.board .bh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-bottom:10px}
.board .nm{font-weight:600;font-size:18px;letter-spacing:-.01em;color:var(--ink)}
.board .nm.s1{text-align:right}
.board .nm .dot{width:10px;height:10px}
.board .bh .nm.s1 .dot{margin:0 0 0 8px}
.board .gm{color:var(--faint);font-size:12px;text-align:center}
.board .br{display:grid;grid-template-columns:1fr minmax(120px,220px) 1fr;align-items:center;gap:12px;padding:8px 0}
.board .br.md{background:#f6f7f9;border-radius:8px;padding:10px clamp(12px,2.4vw,24px);margin-top:10px}
.board .n{font-weight:500;font-size:clamp(56px,10vw,104px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.board .n.s0{color:var(--p0)}
.board .n.s1{color:var(--ink);text-align:right}
.board .lab{display:grid;gap:2px;justify-items:center;text-align:center}
.board .lab .k{font:600 14px/1.2 var(--body);color:var(--ink)}
.board .lab .lead{color:var(--ink);font-size:13px}
.board .lab .sm{color:var(--faint);font-size:12px}
.board .mdstrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.board .mdc{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font:600 12px var(--body);color:#fff;cursor:default}
.board .mdc.w0{background:var(--p0)}.board .mdc.w1{background:var(--p1)}.board .mdc.lv{background:#a3a3a3;color:#fff}
.board .bf{display:flex;justify-content:space-between;gap:12px;color:var(--faint);font-size:12px;margin-top:14px}
@media (max-width:640px){.board .br{grid-template-columns:1fr 100px 1fr}.board .lab .sm{display:none}.board .bh .nm{font-size:16px}}
/* generic */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel{background:var(--surface);border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);padding:20px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--faint);font-weight:500;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f0f0f0;font-variant-numeric:tabular-nums;vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
.res{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:600}
.res.W{background:var(--w-bg);color:var(--w)} .res.D{background:var(--d-bg);color:var(--d)} .res.L{background:var(--l-bg);color:var(--l)}
.form{display:inline-flex;gap:4px}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--d);white-space:nowrap}
.tag.ok{background:var(--w-bg);color:var(--w)} .tag.no{background:var(--l-bg);color:var(--l)} .tag.jk{background:var(--warn-bg);color:var(--warn)}
.btn{background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:6px;min-height:36px;padding:0 18px;font-weight:600;cursor:pointer}
.btn:hover{background:#333}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--control)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:30px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--surface-2);color:var(--d);border-radius:6px;min-height:34px;padding:0 15px;cursor:pointer;font-weight:500}
.chip:hover{background:#e2e2e2}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);font-weight:600}
.chip.new{background:none;box-shadow:inset 0 0 0 1px var(--control);color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.p0{background:var(--p0)} .bar i.p1{background:var(--p1)} .bar i.over{background:var(--l)}
/* scorelines */
.line{display:grid;grid-template-columns:28px 1fr auto 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0}
.line:last-child{border-bottom:0}
.line .sl{color:var(--faint);font-size:12px}
.line .tm{display:flex;align-items:center;gap:6px;min-width:0}
.line .tm.r{justify-content:flex-end;text-align:right}
.line .tm span.t{overflow-wrap:break-word;min-width:0}.line .tm.r .tl{flex-direction:row-reverse}.line .tl{gap:8px}
@media (max-width:640px){.line .tm span.t{font-size:14px}.line .tl{gap:5px}.line .tl .crest{width:16px;height:16px}}
.score{font-weight:600;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.score.w0{color:var(--ink)}
@media (max-width:560px){.line{grid-template-columns:22px 1fr auto 1fr;gap:6px}.score{font-size:19px}}
/* editor */
.erow{display:grid;grid-template-columns:28px 1fr auto 1fr;gap:10px;align-items:start;padding:14px 0;border-bottom:1px solid #f0f0f0}
.erow .side{display:grid;gap:6px}
.erow select,.field select,.field input{width:100%;background:#fff;box-shadow:inset 0 0 0 1px var(--control);border:0;border-radius:6px;padding:9px 12px;min-width:0}
.erow .gl{display:flex;gap:6px;align-items:center;padding-top:20px}
.erow input.g{width:56px;text-align:center;font-weight:600;font-size:16px}
.erow .lbl,.field label{font-size:12px;color:var(--faint)}
.msg{margin:4px 0;font-size:13px} .msg.err{color:var(--l)} .msg.warn{color:var(--warn)} .msg.ok{color:var(--w)}
@media (max-width:700px){.erow{grid-template-columns:1fr}.erow .gl{padding-top:0;justify-content:center}.erow>.sl{display:none}}
.field{display:grid;gap:4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
/* market */
.mk{display:flex;flex-wrap:wrap;gap:6px}
.mk button{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--control);border-radius:6px;padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.mk button:hover{box-shadow:inset 0 0 0 1px #8a8a8a}
.mk button[aria-pressed="true"]{background:var(--btn-bg);color:#fff;box-shadow:none}
.mk button[aria-pressed="true"] .rt i.f,.mk button[aria-pressed="true"] .rt i.h b{color:#fff}.mk button[aria-pressed="true"] .rt i{color:#777}.mk button[aria-pressed="true"] .rt i.f{color:#fff}
.mk button:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px}
.seg button{background:none;border:0;border-radius:6px;min-height:30px;padding:0 16px;cursor:pointer;font-weight:500;color:var(--d)}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);font-weight:600}
/* stats */
.hbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr 44px;gap:8px;align-items:center;padding:4px 0}
.hbar .t{display:flex;align-items:center;min-width:0}.hbar .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px}
.hbar .tr i.p0{background:var(--p0)}.hbar .tr i.p1{background:var(--p1)}
svg text{fill:var(--faint);font:11px var(--body)}
svg .lbl{fill:var(--ink);font-weight:600}
svg .grid{stroke:#ececec;stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;color:var(--muted);font-size:13px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;max-width:260px;display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;z-index:70;display:none;max-width:90vw;font-weight:500}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.sub{color:var(--faint);font-size:13px}
.team-d td{background:#f6f7f9}
.sortb{background:none;border:0;padding:0;font:inherit;font-weight:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.sortb:hover{color:var(--ink)}
th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tl{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}.crest{width:18px;height:18px;object-fit:contain;flex:none}.crest.mono{display:inline-grid;place-items:center;border-radius:50%;background:var(--surface-2);color:var(--ink);font:600 8px/1 var(--body);letter-spacing:0}
.rt{display:inline-flex;gap:1px;font-size:14px;line-height:1;letter-spacing:0;vertical-align:middle;white-space:nowrap}.rt i{font-style:normal;color:var(--star-e);display:inline-flex}.rt i.f{color:var(--star)}.rt i.h{position:relative}.rt i.h b{position:absolute;left:0;top:0;width:50%;overflow:hidden;color:var(--star);display:block;line-height:0}
.ng{display:inline-block}
</style>

<body>
<div class="top"><div class="top-in">
  <div class="brand"><svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="#1d5fbf"/><circle cx="19" cy="11" r="10" fill="#141414" fill-opacity=".9"/></svg><div class="bt">FC26 Tournament<small id="sub">Loading…</small></div></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></div>
<div class="wrap"><main id="app"><div class="empty">Loading the tournament…</div></main></div>
<div id="tip" role="tooltip"></div><div id="toast" role="status"></div>

<script>
/* Stand-in for the claude.ai runtime: window.claude.use('db') / use('user') backed by the Worker API.
   Live updates by polling /api/rev every 3 s. Shared passcode kept in localStorage. */
(function(){
"use strict";
var KEY='fc26-passcode',docs={},rev=-1,subs=[],started=false,authed=false,pass='';
function getKey(){try{return localStorage.getItem(KEY)||'';}catch(e){return '';}}
function setKey(k){try{localStorage.setItem(KEY,k);}catch(e){}}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'x-passcode':pass},opt.headers||{});
  return fetch(path,opt).then(function(r){if(r.status===401){authed=false;throw Object.assign(new Error('unauthorized'),{code:'unauthorized'});}if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function ask(msg){return new Promise(function(res){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:#f2f4f7;display:grid;place-items:center;z-index:999;font:16px system-ui,sans-serif';
  d.innerHTML='<form style="background:#fff;padding:28px;border-radius:8px;box-shadow:inset 0 0 0 1px #e6e6e6;display:grid;gap:12px;width:min(92vw,340px)"><b style="font-size:20px">FC26 Tournament</b><span style="color:#6b6b6b;font-size:14px">'+msg+'</span><input type="password" autocomplete="current-password" required style="padding:10px 12px;border:1px solid #d4d4d4;border-radius:6px;font:inherit"><button style="background:#141414;color:#fff;border:0;border-radius:6px;padding:10px;font:inherit;font-weight:600;cursor:pointer">Enter</button></form>';
  document.body.appendChild(d);var i=d.querySelector('input');i.focus();
  d.querySelector('form').onsubmit=function(e){e.preventDefault();var v=i.value;d.remove();res(v);};
});}
async function login(){
  pass=getKey();var msg='Enter the league passcode.';
  for(;;){
    if(pass){try{await api('/api/rev');authed=true;setKey(pass);return;}catch(e){if(e.code!=='unauthorized')throw e;msg='Wrong passcode, try again.';}}
    pass=await ask(msg);
  }
}
function snapDoc(path){var d=docs[path];return {id:path.split('/').pop(),exists:d!==undefined,data:function(){return JSON.parse(JSON.stringify(d));}};}
function snapColl(c){var out=[];Object.keys(docs).forEach(function(p){if(p.indexOf(c+'/')===0&&p.indexOf('/',c.length+1)<0)out.push(snapDoc(p));});return {docs:out};}
function notify(){subs.forEach(function(s){s();});}
async function pull(){var r=await api('/api/all');rev=r.rev;docs=r.docs;notify();}
function start(){if(started)return;started=true;
  setInterval(async function(){if(document.hidden||!authed)return;try{var r=await api('/api/rev');if(r.rev!==rev)await pull();}catch(e){}},3000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&authed)pull().catch(function(){});});}
var db={
  doc:function(path){return {
    set:function(data){return api('/api/doc/'+encodeURI(path),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(data)}).then(function(){docs[path]=JSON.parse(JSON.stringify(data));notify();return pull();});},
    delete:function(){return api('/api/doc/'+encodeURI(path),{method:'DELETE'}).then(function(){delete docs[path];notify();return pull();});},
    onSnapshot:function(cb){subs.push(function(){cb(snapDoc(path));});setTimeout(function(){cb(snapDoc(path));},0);}
  };},
  collection:function(c){return {onSnapshot:function(cb){subs.push(function(){cb(snapColl(c));});setTimeout(function(){cb(snapColl(c));},0);}};}
};
window.claude={use:async function(name){
  if(name==='db'){await login();await pull();start();return db;}
  if(name==='user')return {can:function(){return true;}};
  return null;
}};
})();

</script>
<script>
(function(){
"use strict";
var S={cfg:null,teams:{},matches:[],transfers:[],loaded:{},db:null,canWrite:null,D:null,
 ui:{tab:'overview',md:null,edit:false,draft:null,tf:{pi:0,out:'',inn:'',nu:'',ns:'4',note:''},filter:'all',sort:{k:'ppg',d:-1},open:{},del:null,busy:false,mktOpen:false}};
var TABS=[['overview','Overview'],['matchdays','Matchdays'],['transfers','Transfers'],['teams','Teams'],['stats','Stats']];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  var mds=Object.keys(mdMap).map(function(k){return mdMap[k];}).sort(function(a,b){return a.md-b.md;});

  mds.forEach(function(g){g.complete=g.scored>=slots;g.gd=g.gf[0]-g.gf[1];
    g.winner=g.complete?(g.w[0]>g.w[1]?0:g.w[1]>g.w[0]?1:g.gd>0?0:g.gd<0?1:-1):null;
    if(g.complete){lastComplete=Math.max(lastComplete,g.md);if(g.winner<0)mdt++;else mdw[g.winner]++;}});
  return {c:c,P:P,slots:slots,ms:ms,trs:trs,ownedAt:ownedAt,ts:ts,st:st,mds:mds,mdw:mdw,mdt:mdt,lastComplete:lastComplete,window:lastComplete+1,scoredGames:scoredGames,mdMap:mdMap};
}
function gamesBefore(D,pi,slug,w){var n=0;D.scoredGames.forEach(function(m){if(m.md<w&&m.f[pi]===slug)n++;});return n;}
function stars(D,set){var t=0;set.forEach(function(s){t+=ts_(s);});return t;}
function idleBefore(D,pi,slug,md){var n=0;for(var k=md-1;k>=1;k--){if(!D.ownedAt(pi,k).has(slug))break;var g=D.mdMap[k];if(g&&g.rows.some(function(m){return m.f[pi]===slug;}))break;n++;}return n;}
function mustPlay(D,pi,md){var c=D.c,out=[];if(!c.maxIdle)return out;D.ownedAt(pi,md).forEach(function(s){if(c.maxGames&&gamesBefore(D,pi,s,md)>=c.maxGames)return;if(idleBefore(D,pi,s,md)>=c.maxIdle)out.push(s);});return out;}
function mustSellHtml(D){var c=D.c,sell=[],play=[],md=D.window;

/* matchday editor */
function initDraft(D,md){
  var g=D.mdMap[md],rows=[];
  for(var k=1;k<=D.slots;k++){
    var m=g&&g.rows.filter(function(r){return r.slot===k;})[0];
    rows.push({slot:k,s:[m&&m.s?m.s[0]||'':'',m&&m.s?m.s[1]||'':''],j:[m&&m.j?m.j[0]||'':'',m&&m.j?m.j[1]||'':''],g:[m&&m.g&&m.g[0]!=null?String(m.g[0]):'',m&&m.g&&m.g[1]!=null?String(m.g[1]):'']});
  }
  return {md:md,rows:rows};
}
function validateDraft(D){
  var d=S.ui.draft,errs=[],warns=[],save=[];
  [0,1].forEach(function(i){
    var own=D.ownedAt(i,d.md),seen={},jk=0,nm=D.P[i].name;
    d.rows.forEach(function(r){
      var f=r.j[i]||r.s[i];
      if(r.j[i])jk++;
      if(r.j[i]&&!r.s[i])errs.push(nm+', slot '+r.slot+': pick the starter the joker replaces.');
      [r.s[i],r.j[i]].forEach(function(x){if(x&&!own.has(x))errs.push(nm+', slot '+r.slot+': '+tn(x)+' is not in the squad for matchday '+d.md+'.');
        if(x&&D.c.maxGames&&gamesBefore(D,i,x,d.md)>=D.c.maxGames)errs.push(nm+', slot '+r.slot+': '+tn(x)+' has already played '+D.c.maxGames+' games and cannot play again.');});
      if(f){if(seen[f])errs.push(nm+' plays '+tn(f)+' twice (slots '+seen[f]+' and '+r.slot+').');else seen[f]=r.slot;}
    });
    var req=mustPlay(D,i,d.md),finals=d.rows.map(function(r){return r.j[i]||r.s[i];}),full=d.rows.every(function(r){return r.s[i];});
    req.forEach(function(s){if(finals.indexOf(s)<0){var mm=nm+': '+tn(s)+' must play this matchday (missed the last '+D.c.maxIdle+').';if(full&&d.md>D.lastComplete)errs.push(mm);else warns.push(mm);}});
    if(D.c.maxJokers&&jk>D.c.maxJokers)warns.push(nm+' uses '+jk+' jokers; so far the limit has been '+D.c.maxJokers+' per matchday.');
  });
  d.rows.forEach(function(r){
    var hasS=r.s[0]&&r.s[1],anyS=r.s[0]||r.s[1],g0=r.g[0]!=='',g1=r.g[1]!=='';
    if(anyS&&!hasS)errs.push('Slot '+r.slot+': both players need a starter.');
    if((g0||g1)&&!(g0&&g1))errs.push('Slot '+r.slot+': enter both scores or neither.');
    if((g0||g1)&&!hasS)errs.push('Slot '+r.slot+': add the teams before the score.');
    [0,1].forEach(function(i){var v=r.g[i];if(v!==''&&(!/^\d{1,2}$/.test(v)))errs.push('Slot '+r.slot+': goals must be a whole number from 0 to 99.');});
  });
  return {errs:errs.filter(function(e,i,a){return a.indexOf(e)===i;}),warns:warns};
}
function editStatus(D){
  var v=validateDraft(D);
  return v.errs.map(function(e){return '<p class="msg err">'+esc(e)+'</p>';}).join('')+v.warns.map(function(e){return '<p class="msg warn">! '+esc(e)+'</p>';}).join('')+(v.errs.length?'':'<p class="msg ok">Lineups are valid.</p>');
}
function teamOpts(D,i,md,sel,taken,empty){

/* transfers */
function tfCheck(D){
  var tf=S.ui.tf,pi=tf.pi,c=D.c,own=D.ownedAt(pi,D.window),used=stars(D,own);
  var cnt=S.transfers.filter(function(t){return t.window===D.window&&t.player===D.P[pi].id;}).length;
  var r={own:own,used:used,cnt:cnt,msgs:[],ok:true,after:used};
  if(cnt>=c.maxTransfers){r.msgs.push(['err',D.P[pi].name+' has used '+cnt+' of '+c.maxTransfers+' transfers for this window.']);r.ok=false;}
  if(!tf.out){r.ok=false;}
  else{var g=gamesBefore(D,pi,tf.out,D.window);if(g<c.minGames){r.msgs.push(['err',tn(tf.out)+' has played '+g+' of '+c.minGames+' games needed before it can be sold.']);r.ok=false;}else r.msgs.push(['ok',tn(tf.out)+' has played '+g+' games, so it can be sold.']);}
  var inStars=null;
  if(!tf.inn){r.ok=false;}
  else if(tf.inn==='__new__'){
    var nm=tf.nu.trim(),sl=slugify(nm);
    if(!nm||!sl){r.ok=false;}else if(S.teams[sl]){r.msgs.push(['err',nm+' is already in the list. Pick it from the list instead.']);r.ok=false;}
    var ns=parseFloat(tf.ns);if(!(ns>=0.5&&ns<=5)){r.msgs.push(['err','Stars must be between 0.5 and 5.']);r.ok=false;}else inStars=ns;
  }else{if(own.has(tf.inn)){r.msgs.push(['err',tn(tf.inn)+' is already in this squad.']);r.ok=false;}inStars=ts_(tf.inn);}
  if(tf.out&&inStars!=null){r.after=used-ts_(tf.out)+inStars;
    if(r.after>c.budget+1e-9){r.msgs.push(['err','Squad would be '+fs(r.after)+' stars'+', over the '+c.budget+' stars limit.']);r.ok=false;}
    else r.msgs.push(['ok','Squad goes from '+fs(used)+' stars'+' to '+fs(r.after)+' stars'+' of '+c.budget+' stars.']);}
  if(S.canWrite===false){r.ok=false;r.msgs.unshift(['err','You can view the league but not change it.']);}
  return r;
}

  h+='<div id="tf-status" style="margin-top:10px">'+tfStatusHtml(r)+'</div><div style="margin-top:10px"><button class="btn" id="tf-go" data-act="tf-go"'+(r.ok&&!S.ui.busy?'':' disabled')+'>Confirm transfer</button></div></section>';

/* teams */
function allEntries(D){
  var keys={};
  Object.keys(D.ts).forEach(function(k){keys[k]=1;});
  D.P.forEach(function(p,i){((D.c.initial&&D.c.initial[p.id])||[]).forEach(function(s){keys[i+'|'+s]=1;});});
  D.trs.forEach(function(t){var i=D.P.map(function(p){return p.id;}).indexOf(t.player);keys[i+'|'+t.inn]=1;});
  return Object.keys(keys).map(function(k){var a=k.split('|'),i=+a[0],s=a.slice(1).join('|');var x=D.ts[k]||{pi:i,slug:s,P:0,W:0,D:0,L:0,GF:0,GA:0,form:[],games:[]};return x;});
}
function history(D,x){
  var id=D.P[x.pi].id,out=[],init=((D.c.initial&&D.c.initial[id])||[]).indexOf(x.slug)>=0;
  if(init)out.push('In the original squad');
  D.trs.forEach(function(t){if(t.player!==id)return;if(t.inn===x.slug)out.push('Signed before MD '+t.window);if(t.out===x.slug)out.push('Sold before MD '+t.window);});
  return out.join(' · ');
}

/* stats */
function niceStep(max){return [5,10,20,25,50,100,200].filter(function(s){return max/s<=5;})[0]||200;}
function chartRace(D){
  var gs=D.mds.filter(function(g){return g.scored>0;});if(!gs.length)return '<p class="sub">No results yet.</p>';
  var n=gs.length,c0=[0],c1=[0];gs.forEach(function(g){c0.push(c0[c0.length-1]+g.pts[0]);c1.push(c1[c1.length-1]+g.pts[1]);});
  var W=640,H=250,L=34,R=84,T=14,B=28,max=Math.max.apply(null,c0.concat(c1)),step=niceStep(max),ym=Math.ceil(max/step)*step||step;
  function X(i){return L+(W-L-R)*i/n;}function Y(v){return T+(H-T-B)*(1-v/ym);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Cumulative points after each matchday">';
  for(var v=0;v<=ym;v+=step)s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
  for(var i=0;i<=n;i++)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+(i===0?'':'MD'+gs[i-1].md)+'</text>';
  [c0,c1].forEach(function(c,pi){
    var col='var(--p'+pi+')';
    s+='<polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" points="'+c.map(function(v,i){return X(i)+','+Y(v);}).join(' ')+'"/>';
    c.forEach(function(v,i){if(i>0)s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(i===n?5:3.5)+'" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/>';});
  });
  var e0=Y(c0[n]),e1=Y(c1[n]);if(Math.abs(e0-e1)<14){if(e0<=e1){e0-=7;e1+=7;}else{e0+=7;e1-=7;}}
  s+='<text class="lbl" x="'+(X(n)+10)+'" y="'+(e0+4)+'">'+esc(D.P[0].name)+' '+c0[n]+'</text><text class="lbl" x="'+(X(n)+10)+'" y="'+(e1+4)+'">'+esc(D.P[1].name)+' '+c1[n]+'</text>';
  for(var k=1;k<=n;k++){s+='<rect x="'+(X(k)-(W-L-R)/n/2)+'" y="'+T+'" width="'+((W-L-R)/n)+'" height="'+(H-T-B)+'" fill="transparent" data-tip="After MD '+gs[k-1].md+': '+esc(D.P[0].name)+' '+c0[k]+' · '+esc(D.P[1].name)+' '+c1[k]+'"/>';}
  return s+'</svg>';
}
function chartMargin(D){
  var gs=D.mds.filter(function(g){return g.scored>0;});if(!gs.length)return '<p class="sub">No results yet.</p>';
  var W=640,H=210,L=34,R=10,T=18,B=28,max=Math.max(4,Math.max.apply(null,gs.map(function(g){return Math.abs(g.gd);}))),ym=Math.ceil(max/5)*5;
  var n=gs.length,bw=(W-L-R)/n;function Y(v){return T+(H-T-B)*(1-(v+ym)/(2*ym));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Goal margin per matchday">';
  [-ym,0,ym].forEach(function(v){s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+sgn(v)+'</text>';});
  gs.forEach(function(g,i){var x=L+bw*i+bw*.2,w=bw*.6,y0=Y(0),y1=Y(g.gd),pi=g.gd>=0?0:1,top=Math.min(y0,y1),h=Math.max(2,Math.abs(y1-y0));
    s+='<rect x="'+x+'" y="'+(g.gd>=0?top:y0)+'" width="'+w+'" height="'+h+'" rx="3" fill="var(--p'+pi+')"/><text class="lbl" x="'+(x+w/2)+'" y="'+(g.gd>=0?top-4:y0+h+12)+'" text-anchor="middle">'+sgn(g.gd)+'</text><text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle">MD'+g.md+'</text>';
    s+='<rect x="'+(L+bw*i)+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" fill="transparent" data-tip="MD '+g.md+': goals '+g.gf[0]+'–'+g.gf[1]+' · '+(g.winner==null?'in progress':g.winner<0?'level':esc(D.P[g.winner].name)+' won')+'"/>';});
  return s+'</svg>';
}
function teamBars(D){
  var rows=allEntries(D).filter(function(x){return x.P>=2;}).sort(function(a,b){return ((3*b.W+b.D)/b.P)-((3*a.W+a.D)/a.P)||b.P-a.P;}).slice(0,12);
  if(!rows.length)return '<p class="sub">Teams need two games to appear here.</p>';
  return rows.map(function(x){var v=(3*x.W+x.D)/x.P;return '<div class="hbar" data-tip="'+esc(tn(x.slug))+': '+x.W+'W '+x.D+'D '+x.L+'L in '+x.P+' games"><span class="t">'+dot(x.pi)+'<span>'+tl(x.slug)+'</span></span><span class="tr"><i class="p'+x.pi+'" style="width:'+(v/3*100)+'%"></i></span><b class="num">'+v.toFixed(2)+'</b></div>';}).join('');
}
function records(D){
  var P=D.P,out=[];
  var per=[0,1].map(function(i){
    var gs=D.scoredGames,best=null,run=0,longest=0,cur=0,curT='';
    gs.forEach(function(m){var r=m.r[i];if(r==='W'){run++;longest=Math.max(longest,run);var mg=m.g[i]-m.g[1-i];if(!best||mg>best.mg||(mg===best.mg&&m.g[i]>best.gf))best={mg:mg,gf:m.g[i],m:m};}else run=0;});
    for(var k=gs.length-1;k>=0;k--){var r=gs[k].r[i];if(!curT)curT=r;if(r===curT)cur++;else break;}
    return {best:best,longest:longest,cur:curT?curT+cur:'—'};
  });
  function bw(i){var b=per[i].best;return b?tl(b.m.f[i])+' '+b.m.g[i]+'–'+b.m.g[1-i]+' '+tl(b.m.f[1-i])+' (MD'+b.m.md+')':'—';}
  var s=D.st,n=D.scoredGames.length||1;
  return [
   ['Games won',s[0].W+' ('+Math.round(s[0].W/n*100)+'%)',s[1].W+' ('+Math.round(s[1].W/n*100)+'%)'],
   ['Goals per game',(s[0].GF/n).toFixed(2),(s[1].GF/n).toFixed(2)],
   ['Goals conceded per game',(s[0].GA/n).toFixed(2),(s[1].GA/n).toFixed(2)],
   ['Matchdays won',D.mdw[0],D.mdw[1]],
   ['Longest winning run',per[0].longest,per[1].longest],
   ['Current run',per[0].cur,per[1].cur],
   ['Biggest win',bw(0),bw(1)]
  ].map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join('');
}
function vStats(D){
  if(!D.scoredGames.length)return '<div class="empty">Play some games and the stats will appear here.</div>';
  var hi=D.scoredGames.slice().sort(function(a,b){return (b.g[0]+b.g[1])-(a.g[0]+a.g[1]);})[0];
  var pairs={};D.scoredGames.forEach(function(m){var k=m.f[0]+'|'+m.f[1];(pairs[k]||(pairs[k]=[])).push(m);});
  var re=Object.keys(pairs).filter(function(k){return pairs[k].length>1;});
  var h='<div class="legend">'+D.P.map(function(p,i){return '<span>'+dot(i)+esc(p.name)+'</span>';}).join('')+'</div>';
  h+='<section class="panel tw"><div class="sec-h"><h2>Head to head</h2></div><table><thead><tr><th></th><th>'+dot(0)+esc(D.P[0].name)+'</th><th>'+dot(1)+esc(D.P[1].name)+'</th></tr></thead><tbody>'+records(D)+'</tbody></table>'+
   '<p class="sub" style="margin:10px 0 0">Highest scoring game: '+tl(hi.f[0])+' '+hi.g[0]+'–'+hi.g[1]+' '+tl(hi.f[1])+' (MD '+hi.md+')</p></section>';
  h+='<div class="grid2"><section class="panel"><div class="sec-h"><h3>Points race</h3><span class="sub">Cumulative, after each matchday</span></div>'+chartRace(D)+'</section>'+
   '<section class="panel"><div class="sec-h"><h3>Matchday margin</h3><span class="sub">Goals, '+esc(D.P[0].name)+' minus '+esc(D.P[1].name)+'</span></div>'+chartMargin(D)+'</section></div>';
  h+='<section class="panel"><div class="sec-h"><h3>Best teams</h3><span class="sub">Points per game, minimum 2 games · <a href="#teams">full table</a></span></div>'+teamBars(D)+'</section>';
  if(re.length)h+='<section class="panel tw"><div class="sec-h"><h3>Rematches</h3><span class="sub">Same two teams meeting again</span></div><table><thead><tr><th>Fixture</th><th>Results</th></tr></thead><tbody>'+re.map(function(k){var ms=pairs[k];return '<tr><td>'+tl(ms[0].f[0])+' <span class="sub">v</span> '+tl(ms[0].f[1])+'</td><td class="num">'+ms.map(function(m){return 'MD'+m.md+' '+m.g[0]+'–'+m.g[1];}).join(' · ')+'</td></tr>';}).join('')+'</tbody></table></section>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var app=document.getElementById('app'),tabs=document.getElementById('tabs');
  tabs.innerHTML=TABS.map(function(t){return '<button class="tab" data-act="tab" data-t="'+t[0]+'"'+(S.ui.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>';}).join('');
  if(!S.db){app.innerHTML='<div class="empty">The league data is not available in this view. Open the page from your Claude artifacts while signed in.</div>';return;}
  if(!S.cfg){app.innerHTML=(S.loaded.cfg?'<div class="empty">The league has no data yet. Ask Claude to import it.</div>':'<div class="empty">Loading the tournament…</div>');return;}
  var D=S.D=derive();
  document.getElementById('sub').textContent=D.P[0].name+' vs '+D.P[1].name+' · '+D.scoredGames.length+' games · '+D.mds.length+' matchdays';
  var h=S.canWrite===false?'<p class="banner">You are viewing this league read-only. Ask the owner for edit access to enter results.</p>':'';
  var t=S.ui.tab;
  h+= t==='matchdays'?vMatchdays(D):t==='transfers'?vTransfers(D):t==='teams'?vTeams(D):t==='stats'?vStats(D):vOverview(D);

}

/* ---------- writes ---------- */
function werr(e){var c=e&&e.code;flash(c==='invalid_argument'||c==='not_granted'?'You do not have permission to change this league.':c==='quota_exceeded'?'The league database is full.':'Could not save. Check your connection and try again.');}
async function setDoc(path,data){await S.db.doc(path).set(data);}
async function saveMd(){
  var D=S.D,d=S.ui.draft,v=validateDraft(D);if(v.errs.length)return;
  S.ui.busy=true;render();
  try{
    for(var k=0;k<d.rows.length;k++){
      var r=d.rows[k],id='md'+pad(d.md)+'-s'+r.slot,ex=S.matches.filter(function(m){return m.id===id;})[0],empty=!(r.s[0]&&r.s[1]);
      if(empty){if(ex)await S.db.doc('matches/'+id).delete();continue;}
      var doc={md:d.md,slot:r.slot,s:[r.s[0],r.s[1]],j:[r.j[0]||null,r.j[1]||null],g:(r.g[0]!==''&&r.g[1]!=='')?[+r.g[0],+r.g[1]]:null};
      if(ex&&JSON.stringify([ex.s,ex.j,ex.g||null])===JSON.stringify([doc.s,doc.j,doc.g]))continue;
      await setDoc('matches/'+id,doc);
    }
    S.ui.edit=false;S.ui.draft=null;flash('Matchday '+d.md+' saved');
  }catch(e){werr(e);}
  S.ui.busy=false;render();
}
async function submitTransfer(){
  var D=S.D,tf=S.ui.tf,pi=tf.pi,id=D.P[pi].id,r=tfCheck(D);if(!r.ok)return;

    var used=S.transfers.filter(function(t){return t.window===D.window&&t.player===id;}).map(function(t){return t.seq;});
    var seq=[1,2,3,4].filter(function(n){return used.indexOf(n)<0;})[0];
    await setDoc('transfers/w'+pad(D.window)+'-'+id+'-'+seq,{window:D.window,player:id,out:tf.out,inn:inn,seq:seq,note:tf.note.trim(),at:Date.now()});
    S.ui.tf={pi:pi,out:'',inn:'',nu:'',ns:'4',note:''};flash('Transfer saved: '+tn(tf.out)+' out, '+(S.teams[inn]?tn(inn):tf.nu.trim())+' in');
  }catch(e){werr(e);}

}

/* ---------- events ---------- */

  else if(a==='save-md'){saveMd();}

    if(t.dataset.f==='s'&&!t.value)r.j[i]='';
    render();}
  else if(bd==='tf'){ui.tf[t.dataset.f]=t.value;if(t.dataset.f==='out'||t.dataset.f==='inn'){render();}else{refreshTf();}}
});
document.addEventListener('input',function(e){
  var t=e.target,bd=t.dataset.bind;if(!bd)return;
  if(bd==='goal'){S.ui.draft.rows[+t.dataset.row].g[+t.dataset.i]=t.value.trim();refreshEdit();}
  else if(bd==='tfx'){S.ui.tf[t.dataset.f]=t.value;refreshTf();}
});
function refreshEdit(){var D=S.D,el=document.getElementById('edit-status');if(!el)return;el.innerHTML=editStatus(D);var b=document.getElementById('save-md');if(b)b.disabled=validateDraft(D).errs.length>0||S.ui.busy;}
function refreshTf(){var D=S.D,el=document.getElementById('tf-status');if(!el)return;var r=tfCheck(D);el.innerHTML=tfStatusHtml(r);var b=document.getElementById('tf-go');if(b)b.disabled=!r.ok||S.ui.busy;}
var tip=document.getElementById('tip');
document.addEventListener('mousemove',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return;}tip.textContent=t.getAttribute('data-tip');tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY+14)+'px';});
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return;}if(e.pointerType==='touch'||!matchMedia('(hover:hover)').matches){tip.textContent=t.getAttribute('data-tip');tip.style.display='block';tip.style.left='12px';tip.style.top=(e.clientY+14)+'px';}});
function route(){var h=(location.hash||'').slice(1);S.ui.tab=TABS.some(function(t){return t[0]===h;})?h:'overview';render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
async function boot(){
  render();
  var cl=window.claude;if(!cl||!cl.use){S.loaded.cfg=true;render();return;}
  var db=await cl.use('db'),user=await cl.use('user');
  if(!db){S.loaded.cfg=true;render();return;}
  S.db=db;
  try{S.canWrite=user?user.can('data.write'):null;}catch(e){S.canWrite=null;}
  function err(e){if(e&&e.code==='revoked')return;console.error(e);}
  db.doc('config/main').onSnapshot(function(s){S.cfg=s.exists?s.data():null;S.loaded.cfg=true;sched();},err);
  db.collection('teams').onSnapshot(function(q){var o={};q.docs.forEach(function(d){o[d.id]=d.data();});S.teams=o;sched();},err);
  db.collection('matches').onSnapshot(function(q){S.matches=q.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});sched();},err);
  db.collection('transfers').onSnapshot(function(q){S.transfers=q.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});sched();},err);
  route();
}
route();boot();
})();
</script>
